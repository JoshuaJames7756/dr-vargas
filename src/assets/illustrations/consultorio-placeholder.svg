<svg viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16302A"/>
      <stop offset="100%" stop-color="#0F211D"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad2)"/>

  <!-- window / wall lines -->
  <rect x="60" y="60" width="480" height="320" rx="4" fill="none" stroke="#37A693" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="380" stroke="#37A693" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="60" y1="220" x2="540" y2="220" stroke="#37A693" stroke-opacity="0.25" stroke-width="2"/>

  <!-- desk -->
  <rect x="90" y="460" width="420" height="18" rx="3" fill="#233F37"/>
  <rect x="120" y="478" width="20" height="140" fill="#1B2E28"/>
  <rect x="460" y="478" width="20" height="140" fill="#1B2E28"/>

  <!-- chair silhouette -->
  <path d="M420 620 C420 560 460 540 470 540 C480 540 520 560 520 620 L520 660 L420 660 Z" fill="#0B7C80" opacity="0.55"/>

  <!-- plant / lotus accent -->
  <g transform="translate(150,540)" opacity="0.8">
    <path d="M0 60 C-30 40 -30 0 0 -30 C30 0 30 40 0 60 Z" fill="#37A693"/>
    <path d="M0 60 C-45 45 -50 0 -10 -20 C10 -5 10 40 0 60 Z" fill="#96D1CB" opacity="0.6"/>
    <path d="M0 60 C45 45 50 0 10 -20 C-10 -5 -10 40 0 60 Z" fill="#96D1CB" opacity="0.6"/>
    <rect x="-4" y="55" width="8" height="40" fill="#0B7C80"/>
  </g>

  <!-- monitor hint -->
  <rect x="330" y="420" width="100" height="65" rx="3" fill="#0F211D" stroke="#37A693" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="365" y="485" width="30" height="8" fill="#233F37"/>

  <!-- label -->
  <g transform="translate(300,690)">
    <rect x="-110" y="-20" width="220" height="40" rx="3" fill="#0F211D" fill-opacity="0.85" stroke="#F7F4EC" stroke-opacity="0.25"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#96D1CB">Foto referencial · pendiente sesión real</text>
  </g>
