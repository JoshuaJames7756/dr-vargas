<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16302A"/>
      <stop offset="100%" stop-color="#0F211D"/>
    </linearGradient>
    <linearGradient id="figGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37A693"/>
      <stop offset="100%" stop-color="#0B7C80"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bgGrad)"/>

  <!-- coat shoulders shape -->
  <path d="M150 800 C150 600 190 520 300 500 C410 520 450 600 450 800 Z" fill="#1F3A32" opacity="0.9"/>

  <!-- torso silhouette (coat) -->
  <path d="M180 800 C180 640 220 560 300 545 C380 560 420 640 420 800 Z" fill="#233F37"/>

  <!-- lapel lines -->
  <path d="M300 545 L260 640 L300 610 L340 640 Z" fill="#16302A"/>

  <!-- head silhouette -->
  <circle cx="300" cy="380" r="105" fill="url(#figGrad)" opacity="0.85"/>

  <!-- stethoscope hint -->
  <path d="M245 560 Q230 610 260 630 Q290 648 300 610" stroke="#96D1CB" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
  <path d="M355 560 Q370 610 340 630 Q310 648 300 610" stroke="#96D1CB" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round"/>
  <circle cx="300" cy="610" r="10" fill="#96D1CB" opacity="0.55"/>

  <!-- decorative lotus mark, subtle -->
  <g transform="translate(300,220)" opacity="0.25">
    <path d="M0 40 C-40 20 -40 -20 0 -40 C40 -20 40 20 0 40 Z" fill="#F7F4EC"/>
  </g>

  <!-- label -->
  <g transform="translate(300,740)">
    <rect x="-110" y="-20" width="220" height="40" rx="3" fill="#0F211D" fill-opacity="0.85" stroke="#F7F4EC" stroke-opacity="0.25"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#96D1CB">Foto referencial · pendiente sesión real</text>
  </g>
</svg>
